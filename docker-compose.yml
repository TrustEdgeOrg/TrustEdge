services:
  # Optional local LLM (~3GB+ image + model). Enable with: COMPOSE_PROFILES=ai docker compose up -d
  # See scripts/ec2-setup-ollama.sh
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    container_name: trustedge-ollama
    ports:
      # Reachable from backend via host.docker.internal when compose DNS name is unavailable
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: always

  redis:
    image: redis:7-alpine
    container_name: trustedge-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: trustedge-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    # Production secrets live on the EC2 host (survives CI/CD); see scripts/ec2-sync-backend-env.sh
    env_file:
      - /etc/trustedge/backend.env
    environment:
      PYTHONUNBUFFERED: "1"
      LOG_TO_FILE: "0"  # Disable file logging in production (logs go to stdout/stderr)
      LOG_JSON: "1"
      LOG_LEVEL: "INFO"
      LOG_SERVICE: "backend"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DETECTION_ENGINE_URL: ${DETECTION_ENGINE_URL:-http://detection-engine:9090}
      # AI review settings: use /etc/trustedge/backend.env only (compose env would override env_file)
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - ./backend:/app
    command: >
      bash -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
      "

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: trustedge-redpanda
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: always

  redpanda-console:
    profiles: ["console"]
    image: ${REDPANDA_CONSOLE_IMAGE:-docker.redpanda.com/redpandadata/console:v2.8.8}
    container_name: trustedge-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:${REDPANDA_CONSOLE_PORT:-8081}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: always

  detection-engine:
    build:
      context: ./detection-engine
      dockerfile: Dockerfile
    container_name: trustedge-detection-engine
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: trustedge.agent.events
      KAFKA_GROUP_ID: detection-engine
      ALERT_API_PORT: "9090"
      TRUSTEDGE_POST_ALERTS_TO_BACKEND: "1"
      TRUSTEDGE_POST_BEHAVIORS_TO_BACKEND: "1"
      TRUSTEDGE_POST_AGENT_ACTIONS_TO_BACKEND: "1"
      API_BASE_URL: http://backend:8000
      TRUSTEDGE_INGEST_TOKEN: ${TRUSTEDGE_INGEST_TOKEN:-}
      LOG_JSON: "1"
      LOG_LEVEL: INFO
      LOG_SERVICE: detection-engine
    depends_on:
      redpanda:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: always

  trustedge-agent-api:
    profiles: ["agent"]
    image: ${TRUSTEDGE_AGENT_API_IMAGE:-trustedge-agent-api:missing}
    container_name: trustedge-agent-api
    ports:
      - "${TRUSTEDGE_AGENT_API_HOST_BIND:-0.0.0.0}:${TRUSTEDGE_AGENT_API_PORT:-8080}:8080"
    environment:
      TRUSTEDGE_AGENT_LISTEN: ":8080"
      TRUSTEDGE_AGENT_DATA_DIR: /data
      TRUSTEDGE_AGENT_ENROLL_TOKEN: ${TRUSTEDGE_AGENT_ENROLL_TOKEN:-}
      TRUSTEDGE_AGENT_PRODUCTION: ${TRUSTEDGE_AGENT_PRODUCTION:-1}
      # Upsert agents into TrustEdge Postgres (fail-open if backend unreachable)
      TRUSTEDGE_BACKEND_URL: ${TRUSTEDGE_BACKEND_URL:-http://backend:8000}
      TRUSTEDGE_INGEST_TOKEN: ${TRUSTEDGE_INGEST_TOKEN:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Device auth: dedicated Postgres DB (not control-plane RDS). Postgres-only by default.
      # Optional auth-cache Redis: set TRUSTEDGE_AGENT_DEVICE_CREDS_REDIS_URL only if needed at scale.
      TRUSTEDGE_AGENT_DEVICE_CREDS_DATABASE_URL: ${TRUSTEDGE_AGENT_DEVICE_CREDS_DATABASE_URL:-}
      TRUSTEDGE_AGENT_DEVICE_CREDS_REDIS_URL: ${TRUSTEDGE_AGENT_DEVICE_CREDS_REDIS_URL:-}
      TRUSTEDGE_AGENT_DEVICE_CREDS_CACHE_TTL_SEC: ${TRUSTEDGE_AGENT_DEVICE_CREDS_CACHE_TTL_SEC:-300}
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: trustedge.agent.events
    volumes:
      - trustedge-agent-data:/data
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  ollama-data:
  trustedge-agent-data:
  redpanda-data:

