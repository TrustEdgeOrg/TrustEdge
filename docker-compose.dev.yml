# Local test stack for macOS / laptop (no EC2 host paths).
# Usage: ./scripts/dev-up.sh
#        docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --build
#
# Local/dev compose for API, Postgres, Redis, and agent ingest.
# Frontend runs on the host: cd frontend && npm start
# TrustEdge Agent ingest API: build from sibling ../TrustEdge-Agent-API (see TrustEdgeOrg/TrustEdge-Agent-API).

name: trustedge-dev

services:
  ollama:
    image: ollama/ollama:latest
    container_name: trustedge-dev-ollama
    ports:
      - "${DEV_OLLAMA_PORT:-11434}:11434"
    volumes:
      - trustedge-dev-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: trustedge-dev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trustedge
      POSTGRES_DB: trustedge
    ports:
      - "${DEV_POSTGRES_PORT:-5432}:5432"
    volumes:
      - trustedge-dev-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustedge"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trustedge-dev-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${DEV_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Agent-API owns device credentials (DB-per-service; not the control-plane DB).
  postgres-agent-api:
    image: postgres:16-alpine
    container_name: trustedge-dev-postgres-agent-api
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trustedge
      POSTGRES_DB: trustedge_agent_api
    ports:
      - "${DEV_POSTGRES_AGENT_API_PORT:-5433}:5432"
    volumes:
      - trustedge-dev-pg-agent-api:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustedge_agent_api"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: trustedge-dev-api
    ports:
      - "${DEV_API_PORT:-8000}:8000"
    env_file:
      - .env.dev
    environment:
      # In-compose service DNS (overrides host-oriented values in .env.dev)
      DB_URL: postgresql+psycopg2://postgres:trustedge@postgres:5432/trustedge
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: "1"
      LOG_TO_FILE: "0"
      LOG_JSON: "0"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_SERVICE: backend
      ENVIRONMENT: development
      DETECTION_ENGINE_URL: ${DETECTION_ENGINE_URL:-http://detection-engine:9090}
      OLLAMA_BASE_URL: http://ollama:11434
      BEHAVIOR_SUPPRESS_COUNT: ${BEHAVIOR_SUPPRESS_COUNT:-20}
      BEHAVIOR_SUPPRESS_AGE_HOURS: ${BEHAVIOR_SUPPRESS_AGE_HOURS:-0}
      BEHAVIOR_PROFILE_MIN_KEYS: ${BEHAVIOR_PROFILE_MIN_KEYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      bash -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips='*'
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 50s
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: trustedge-dev-redpanda
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "${DEV_REDPANDA_PORT:-19092}:19092"
    volumes:
      - trustedge-dev-redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redpanda-console:
    image: ${REDPANDA_CONSOLE_IMAGE:-docker.redpanda.com/redpandadata/console:v2.8.8}
    container_name: trustedge-dev-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:${DEV_REDPANDA_CONSOLE_PORT:-8081}:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  detection-engine:
    build:
      context: ./detection-engine
      dockerfile: Dockerfile
    container_name: trustedge-dev-detection-engine
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: trustedge.agent.events
      KAFKA_GROUP_ID: detection-engine
      ALERT_API_PORT: "9090"
      TRUSTEDGE_POST_ALERTS_TO_BACKEND: "1"
      TRUSTEDGE_POST_BEHAVIORS_TO_BACKEND: "1"
      TRUSTEDGE_POST_AGENT_ACTIONS_TO_BACKEND: "1"
      API_BASE_URL: http://backend:8000
      TRUSTEDGE_INGEST_TOKEN: ${TRUSTEDGE_INGEST_TOKEN:-}
      TRUSTEDGE_BEHAVIOR_BASELINE: "1"
      LOG_JSON: "1"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_SERVICE: detection-engine
    depends_on:
      redpanda:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  trustedge-agent-api:
    image: ${TRUSTEDGE_AGENT_API_IMAGE:-trustedge-agent-api:local}
    build:
      context: ${TRUSTEDGE_AGENT_BUILD_CONTEXT:-../TrustEdge-Agent-API}
      dockerfile: Dockerfile
    container_name: trustedge-dev-agent-api
    # Fresh named volumes are root-owned; run as root in local dev only.
    user: "0:0"
    ports:
      - "${DEV_TRUSTEDGE_AGENT_API_PORT:-8080}:8080"
    environment:
      TRUSTEDGE_AGENT_LISTEN: ":8080"
      TRUSTEDGE_AGENT_DATA_DIR: /data
      TRUSTEDGE_AGENT_ENROLL_TOKEN: ${TRUSTEDGE_AGENT_ENROLL_TOKEN:-}
      TRUSTEDGE_AGENT_PRODUCTION: "0"
      TRUSTEDGE_BACKEND_URL: ${TRUSTEDGE_BACKEND_URL:-http://backend:8000}
      TRUSTEDGE_INGEST_TOKEN: ${TRUSTEDGE_INGEST_TOKEN:-}
      REDIS_URL: redis://redis:6379/0
      # Postgres-only device auth (no auth-cache Redis). Own DB, not control-plane postgres.
      TRUSTEDGE_AGENT_DEVICE_CREDS_DATABASE_URL: postgresql://postgres:trustedge@postgres-agent-api:5432/trustedge_agent_api
      KAFKA_BROKERS: redpanda:9092
      KAFKA_TOPIC: trustedge.agent.events
    volumes:
      - trustedge-dev-agent-data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres-agent-api:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  trustedge-dev-pg:
  trustedge-dev-pg-agent-api:
  trustedge-dev-agent-data:
  trustedge-dev-redpanda-data:
  trustedge-dev-ollama-data:
